<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070708" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="ANIMA" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Pantalla de la aplicación, no del sitio: fuera de los buscadores. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>ANIMA — El mundo vivo de las Almas</title>
  <meta name="description" content="ANIMA es un mundo vivo habitado por Almas. Entra al HOME: el estado del mundo, tu Alma, tu Clan y tu Santuario." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/umbral.css" />
  <link rel="stylesheet" href="assets/css/home.css?v=home-v2" />
  <style>
    /* HOME minimalista — mismo diseño en todo dispositivo, solo adaptado. */
    .world-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
      margin-top:12px;font-size:13px;color:var(--muted)}
    .world-line .pip{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.7}
    .soul-sleep{display:flex;align-items:center;gap:12px;padding:14px 18px;border:1px solid var(--line);
      border-radius:16px;background:linear-gradient(135deg,rgba(208,170,99,.10),transparent);margin-bottom:18px}
    .soul-sleep .moon{font-size:20px}
    .soul-sleep b{color:var(--gold-deep)}
    .home-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px}
    @media(max-width:680px){ .home-cta .cbtn{flex:1;text-align:center} }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js?v=nucleo-v14"></script>
  <script src="assets/js/anima-state.js?v=nucleo-v12"></script>
  <script src="assets/js/icons.js?v=nucleo-v17"></script>
</head>
<body class="rite h2" style="display:block;align-items:stretch;justify-content:flex-start">
  <div class="field"><div class="core"></div></div>
  <!-- La luz del portal: resplandor y dos haces que dibujan la ∧ (home.css). -->
  <div class="p-luz" aria-hidden="true"><i></i><i></i></div>

  <!-- Intro: la ∧ se traza y el Home sube. Solo la primera vez de la sesión. -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-in">
      <svg class="intro-mark" viewBox="23 27 54 48"><path pathLength="1" d="M28 72 L50 30 L72 72"/></svg>
      <div class="intro-word">ANIMA</div>
      <div class="intro-line"></div>
    </div>
  </div>

  <main class="home-wrap" id="home"><!-- inyectado --></main>

  <script src="assets/js/rite.js"></script>
  <script>
  /* ===========================================================
     HOME PRINCIPAL — minimalista, igual en todo dispositivo.
     Sin sesión → Almas actuales + Estado del Mundo.
     Con sesión → Tiempo que el Alma llevaba sin entrar + acceso a
                  Mi Alma / Clan / Santuario (si tienen acceso).
     =========================================================== */
  var CREATOR_EMAIL = "sarkgraff@gmail.com";
  var home = document.getElementById("home");
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var PEAK = '<svg viewBox="23 27 54 48" fill="none"><path d="M28 72 L50 30 L72 72" stroke="#f4f2ed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function IC(nombre, respaldo){ return (window.ANIMA_ICON ? ANIMA_ICON(nombre, respaldo) : respaldo); }

  /* ---------- Intro ----------
     La primera vez de la sesión la ∧ se traza (≈1,2 s) mientras se cargan la
     sesión y el Alma; el Home sube cuando ambas cosas terminaron. Después, o
     con «reducir movimiento», entra directo con un fundido corto. */
  var INTRO_T0 = Date.now();
  var introVista = false;
  try { introVista = sessionStorage.getItem("anima_intro") === "1"; sessionStorage.setItem("anima_intro", "1"); } catch (e) {}
  var sinMovimiento = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function () { var el = document.getElementById("intro"); if (el && (introVista || sinMovimiento)) el.remove(); })();
  function revelar(){
    var espera = document.getElementById("intro") ? Math.max(0, 1250 - (Date.now() - INTRO_T0)) : 0;
    setTimeout(function () {
      var el = document.getElementById("intro");
      if (el) { el.classList.add("fuera"); setTimeout(function () { el.remove(); }, 520); }
      requestAnimationFrame(function () { document.body.classList.add("listo"); });
      setTimeout(function () { document.body.classList.add("listo"); }, 80);   // por si el navegador demora el frame
    }, espera);
  }
  function saludoHora(){ var h = new Date().getHours(); return h < 6 ? "Buenas noches" : h < 13 ? "Buenos días" : h < 20 ? "Buenas tardes" : "Buenas noches"; }
  function hoyLargo(){ try { return new Date().toLocaleDateString("es-CL", { weekday:"long", day:"numeric", month:"long" }); } catch (e) { return ""; } }

  /* Tiempo que el Alma llevaba sin entrar (se lee ANTES de re-sellar la hora). */
  var SLEPT = AnimaState.sleptText(AnimaState.lastSeen());

  var ctx = { signedIn: false, email: "", plan: "ALMA", isCreator: false,
              perfil: null, verIdiomas: false };

  /* El menú de la cuenta es EL MISMO en las tres pantallas donde aparece: aquí,
     en el Taller (studio.html) y en COMPANY. Mismo orden y mismas filas al
     fondo — idioma, ayuda, mejorar plan, instalar y salir—, porque quien usa
     las dos plataformas no tiene por qué aprender dos veces dónde se cierra la
     sesión. Lo único que cambia son los destinos de arriba. */
  var IDIOMAS = [
    { codigo: "es", nombre: "Español", listo: true },
    { codigo: "en", nombre: "English", listo: false }
  ];

  /* El navegador ofrece el diálogo de instalación una sola vez y hay que
     guardarlo en cuanto llega; si no, se pierde. Safari no lo dispara nunca,
     y para ese caso se explica cómo hacerlo a mano. */
  var promptInstalar = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); promptInstalar = e; });
  window.addEventListener("appinstalled", function () { promptInstalar = null; });

  function planAllows(level){
    if (ctx.isCreator) return true;
    if (level === "CLAN") return ctx.plan === "CLAN" || ctx.plan === "SANTUARIO";
    if (level === "SANTUARIO") return ctx.plan === "SANTUARIO";
    return true;
  }

  function menuHTML(){
    var s = AnimaState.get();
    var nombre = (ctx.perfil && ctx.perfil.full_name) || s.name || "Mi cuenta";
    var correo = (ctx.perfil && ctx.perfil.email) || ctx.email || "";
    var codigo = (ctx.perfil && ctx.perfil.locale) || "es";
    var idioma = IDIOMAS.filter(function (i) { return i.codigo === codigo; })[0] || IDIOMAS[0];
    var h = [];

    h.push('<div class="apop-head"><b>' + esc(nombre) + '</b>' +
           (correo ? '<span>' + esc(correo) + '</span>' : '') + '</div>');
    h.push('<div class="apop-sep"></div>');

    /* Dónde entro */
    h.push('<a class="apop-item" href="studio.html">✦ Mi Alma</a>');
    if (planAllows("CLAN"))      h.push('<a class="apop-item" href="studio.html#go=clanpanel">❂ Mi Clan</a>');
    if (planAllows("SANTUARIO")) h.push('<a class="apop-item" href="studio.html#go=santuario">🜁 Santuario</a>');
    h.push('<a class="apop-item" href="studio.html#go=miplan">❖ Mi plan</a>');
    h.push('<a class="apop-item" href="planes.html">↑ Mejorar plan</a>');
    h.push('<div class="apop-sep"></div>');

    /* Los cinco de siempre, en el mismo orden que en COMPANY */
    h.push('<button class="apop-item" id="almaIdioma">🌐 Idioma<span class="apop-pista">' +
           esc(idioma.nombre) + '</span></button>');
    if (ctx.verIdiomas) {
      h.push(IDIOMAS.map(function (i) {
        return '<button class="apop-sub' + (i.codigo === codigo ? ' on' : '') + '" data-idioma="' + i.codigo + '"' +
               (i.listo ? '' : ' disabled') + '>' + i.nombre +
               (i.listo ? '' : ' · aún no traducido') + (i.codigo === codigo ? ' ✓' : '') + '</button>';
      }).join(''));
    }
    h.push('<a class="apop-item" href="mailto:tscanima@gmail.com?subject=' +
           encodeURIComponent('ANIMA — necesito ayuda') + '">✉ Obtener ayuda</a>');
    h.push('<button class="apop-item" id="almaInstall">⤓ Instalar aplicación</button>');
    h.push('<div class="apop-sep"></div>');
    h.push('<button class="apop-item danger" id="logoutAlma">⏻ Cerrar sesión</button>');
    return h.join('');
  }

  function pintarMenu(){
    var pop = document.getElementById("almaPop");
    if (pop) pop.innerHTML = menuHTML();
  }

  /* El perfil (nombre e idioma) se pide una vez y se guarda en `profiles`, la
     misma fila que usa COMPANY: el idioma elegido allá es el que se encuentra
     acá. */
  async function cargarPerfil(){
    if (ctx.perfil || typeof Cloud === "undefined" || !Cloud.enabled) return;
    try {
      ctx.perfil = await Cloud.perfil();
      pintarMenu();
    } catch (e) {}
  }

  async function instalarApp(){
    if (promptInstalar) {
      promptInstalar.prompt();
      try { await promptInstalar.userChoice; } catch (e) {}
      promptInstalar = null;
      return;
    }
    alert("Cómo instalar ANIMA:\n\n• iPhone o iPad: Compartir → \"Añadir a pantalla de inicio\".\n" +
          "• Android: menú del navegador → \"Instalar aplicación\".\n" +
          "• Computador: el icono de instalar, al final de la barra de direcciones.");
  }

  /* Cabecera común: marca + (menú del Alma | Entrar). */
  function topBar(){
    var s = AnimaState.get();
    var nameFirst = (s.name || "Alma").split(" ")[0];
    var right = ctx.signedIn
      ? '<div class="alma-pill" id="almaPill"><span class="adot"></span>' + esc(nameFirst) +
          '<span class="acaret">⌄</span><div class="alma-pop" id="almaPop">' + menuHTML() + '</div></div>'
      : '<a class="h-btn pri h-btn-sm" href="entrar.html">Entrar</a>';
    return '<div class="home-top">' +
        '<div class="home-brand"><span class="m">' + PEAK + '</span>ANIMA</div>' +
        '<div class="h-der">' + right + '</div>' +
      '</div>';
  }

  function foot(){
    return '<div class="home-foot rv" style="--d:9">' +
        '<strong>ANIMA TSC</strong> · Technology System Connection<br>' +
        '<a href="arbol.html">Árbol de Almas</a>·<a href="planes.html">Planes</a>·<a href="legal.html#privacidad">Privacidad</a>' +
      '</div>';
  }

  /* ---------- Sin sesión: Almas actuales + Estado del Mundo ---------- */
  function renderGuest(){
    home.innerHTML =
      '<div class="rv" style="--d:0">' + topBar() + '</div>' +
      '<div class="h-hero h-guest">' +
        '<div class="h-eyebrow rv" style="--d:1">ANIMA STUDIO · Era del Origen</div>' +
        '<h1 class="h-title rv" style="--d:2">Un mundo está <em>despertando</em>.</h1>' +
        '<p class="h-sub rv" style="--d:3">ANIMA es un mundo vivo habitado por Almas: tu taller, tu memoria y tu clan en un solo lugar.</p>' +
        '<div class="h-cupo rv" style="--d:4">' +
          '<div class="num"><span id="homeSouls" style="font-size:inherit;color:inherit">·</span> <span>/ 100 Almas</span></div>' +
          '<div class="barra"><i id="homeSoulsBar"></i></div>' +
          '<small id="homeSoulsSub">El Umbral de ANIMA.</small>' +
        '</div>' +
        '<div class="h-cta rv" style="--d:5">' +
          '<a class="h-btn pri" href="entrar.html">Entrar a mi Alma</a>' +
          '<a class="h-btn sec" href="entrar.html#pedir">Pedir acceso</a>' +
        '</div>' +
      '</div>' +
      foot();
    fillSouls();
    revelar();
  }

  /* ---------- Con sesión: saludo + accesos ---------- */
  function renderSignedIn(){
    var s = AnimaState.get();
    var nameFirst = (s.name || "Alma").split(" ")[0];

    function entry(level, icono, title, desc, href, d){
      var ok = planAllows(level);
      if (ok) return '<a class="h-card rv" style="--d:' + d + '" href="' + href + '"><span class="ic">' + IC(icono, "◆") + '</span>' +
        '<span class="flecha" aria-hidden="true">→</span><div class="txt"><b>' + title + '</b><small>' + desc + '</small></div></a>';
      return '<div class="h-card bloq rv" style="--d:' + d + '"><span class="ic">' + IC(icono, "◆") + '</span>' +
        '<span class="flecha" aria-hidden="true">' + IC("lock", "🔒") + '</span><div class="txt"><b>' + title + '</b><small>' + desc + '</small>' +
        '<a href="planes.html">Desbloquear con un plan →</a></div></div>';
    }
    var entries =
      entry("ALMA", "alma", "Mi Alma", "Tu espacio: proyectos, clientes, cotizaciones y memoria.", "studio.html", 4) +
      entry("CLAN", "constelacion", "Clan", "Tu equipo de 2 a 8 Almas: agenda y memoria compartidas.", "studio.html#go=clanpanel", 5) +
      entry("SANTUARIO", "santuario", "Santuario", "La organización: varios Clanes coordinados.", "studio.html#go=santuario", 6);

    function chip(v, icono, t, extra){ return '<a class="h-chip" href="studio.html#go=' + v + '">' + IC(icono, "◆") + t + (extra || '') + '</a>'; }
    var nuevas = ctx.leadsNuevas || 0;
    var atajos =
      '<div class="h-atajos rv" style="--d:7"><div class="h-eyebrow">Ir directo al Taller</div><div class="h-chips">' +
        chip("centro", "enlace", "Centro de clientes", nuevas ? '<span class="n">' + (nuevas > 9 ? "9+" : nuevas) + '</span>' : '') +
        chip("proyectos", "proceso", "Proyectos") +
        chip("cotizador", "documento", "Cotizador") +
        chip("agenda", "agenda", "Agenda") +
        chip("finanzas", "raiz", "Raíz") +
      '</div></div>';

    var aviso = nuevas
      ? '<a class="h-aviso rv" style="--d:3" href="studio.html#go=centro"><span class="ic">' + IC("enlace", "✉") + '</span>' +
          '<div><b>' + nuevas + (nuevas === 1 ? ' solicitud nueva' : ' solicitudes nuevas') + '</b><small>Llegaron desde tus anuncios · Centro de clientes</small></div>' +
          '<span class="go" aria-hidden="true">→</span></a>'
      : '';

    var sub = SLEPT
      ? 'Tu Alma durmió ' + esc(SLEPT) + '. Qué bueno verte de nuevo.'
      : 'Elige por dónde entrar hoy.';

    home.innerHTML =
      '<div class="rv" style="--d:0">' + topBar() + '</div>' +
      '<div class="h-hero">' +
        '<div class="h-eyebrow rv" style="--d:1">' + esc(hoyLargo()) + '</div>' +
        '<h1 class="h-title rv" style="--d:2">' + saludoHora() + ',<br><em>' + esc(nameFirst) + '</em>.</h1>' +
        '<p class="h-sub rv" style="--d:3">' + sub + '</p>' +
      '</div>' +
      aviso +
      '<div class="h-grid">' + entries + '</div>' +
      atajos +
      foot();

    wireAlmaMenu();
    revelar();
  }

  /* Solicitudes nuevas del Centro de clientes (las mismas que cuenta el menú
     de STUDIO). Si la consulta falla, el Home se dibuja igual sin el aviso. */
  async function contarSolicitudes(almaId){
    try {
      if (!almaId || typeof Cloud === "undefined" || !Cloud.client) return 0;
      var r = await Cloud.client.from("client_leads").select("id", { count: "exact", head: true }).eq("alma_id", almaId).eq("status", "nuevo");
      return r.count || 0;
    } catch (e) { return 0; }
  }

  function wireAlmaMenu(){
    var pill = document.getElementById("almaPill");
    if (!pill) return;
    var pop = document.getElementById("almaPop");

    pill.addEventListener("click", function (e) {
      /* Lo que está dentro del menú lo maneja el menú. */
      if (e.target.closest(".apop-item") || e.target.closest(".apop-sub")) return;
      var abriendo = !pop.classList.contains("open");
      pop.classList.toggle("open");
      if (abriendo) { ctx.verIdiomas = false; pintarMenu(); cargarPerfil(); }
    });
    document.addEventListener("click", function (e) { if (!e.target.closest("#almaPill")) pop.classList.remove("open"); });

    /* Las acciones del menú, por delegación: el contenido se repinta al elegir
       idioma, así que enganchar botón por botón dejaría manejadores muertos. */
    pop.addEventListener("click", async function (e) {
      if (e.target.closest("#almaIdioma")) { ctx.verIdiomas = !ctx.verIdiomas; pintarMenu(); return; }
      var idi = e.target.closest("[data-idioma]");
      if (idi) {
        var codigo = idi.getAttribute("data-idioma");
        ctx.perfil = Object.assign({}, ctx.perfil || {}, { locale: codigo });
        ctx.verIdiomas = false; pintarMenu();
        try { await Cloud.fijarIdioma(codigo); } catch (err) {}
        return;
      }
      if (e.target.closest("#almaInstall")) { pop.classList.remove("open"); instalarApp(); return; }
      if (e.target.closest("#logoutAlma")) {
        try { await Cloud.signOut(); } catch (err) {}
        ctx.signedIn = false; render();
      }
    });
  }

  function render(){ if (ctx.signedIn) renderSignedIn(); else renderGuest(); }

  /* Almas actuales — contador vivo desde la nube. */
  async function fillSouls(){
    var nEl = document.getElementById("homeSouls");
    if (!nEl) return;
    var n = 0;
    try { if (typeof Cloud !== "undefined" && Cloud.enabled) n = (await Cloud.soulsCount()) || 0; } catch (e) {}
    nEl.textContent = n;
    var sub = document.getElementById("homeSoulsSub");
    if (sub) sub.textContent = n >= 100 ? "El Umbral está completo."
      : n >= 90 ? "El Umbral está casi completo."
      : "Quedan " + (100 - n) + " lugares en ANIMA.";
    var b = document.getElementById("homeSoulsBar");
    if (b) setTimeout(function(){ b.style.width = Math.max(2, Math.round(n)) + "%"; }, 900);
  }

  /* Init: reconcilia con la nube (sesión/plan) y pinta una vez. */
  (async function init() {
    try {
      if (typeof Cloud !== "undefined" && Cloud.enabled) {
        var session = await Cloud.session();
        if (session) {
          ctx.signedIn = true;
          ctx.email = (session.user && session.user.email || "").toLowerCase();
          ctx.isCreator = ctx.email === CREATOR_EMAIL;
          var row = await Cloud.myAlma();
          if (row) {
            ctx.plan = row.plan || "ALMA";
            ctx.leadsNuevas = await contarSolicitudes(row.id);
            var st = AnimaState.get();
            if (row.name) st.name = row.name;
            if (row.affinity) st.affinity = row.affinity;
            AnimaState.save(st);
            await AnimaState.syncCloud(row);
          }
        }
      }
    } catch (e) {}
    render();
    if (window.Rite && Rite.pullToRefresh) Rite.pullToRefresh();
  })();
  </script>
</body>
</html>
