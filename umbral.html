<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ANIMA</title>
  <style>html,body{margin:0;height:100%;background:#0b0b0c;color:#f4f2ed;font:14px/1.5 Inter,system-ui,sans-serif}
    body{display:grid;place-items:center}a{color:inherit}</style>
  <script>
    /* El Umbral de la Alpha ya no existe: crear cuenta vive en /app/, con la
       estética de la plataforma. Esta página queda para que los enlaces de
       invitación ya enviados (umbral.html?invitacion=CÓDIGO) sigan sirviendo. */
    (function () {
      var q = new URLSearchParams(location.search), inv = q.get("invitacion") || q.get("codigo") || q.get("code");
      if (!inv) { try { inv = localStorage.getItem("anima_invitacion"); } catch (e) {} }
      location.replace("app/" + (inv ? "?invitacion=" + encodeURIComponent(inv) : ""));
    })();
  </script>
</head>
<body><a href="app/">Entrar a ANIMA →</a></body>
</html>
