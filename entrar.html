<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ANIMA" />
  <!-- Pantalla de la aplicación, no del sitio: fuera de los buscadores. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Entrar — ANIMA</title>
  <meta name="description" content="Entra a tu Alma en ANIMA." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/umbral.css" />
  <style>
    .auth-card{position:relative;z-index:2;width:100%;max-width:420px;margin:0 auto;padding:34px 26px 30px;
      background:var(--card);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(10px);
      box-shadow:0 24px 60px rgba(0,0,0,.08);animation:rise .8s var(--ease) both}
    .auth-mark{display:flex;justify-content:center;margin-bottom:6px}
    .auth-mark svg{width:38px;height:38px}
    .auth-card h1{text-align:center;font-size:24px;letter-spacing:-.02em;margin:8px 0 2px}
    .auth-card .sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 22px}
    .fld{margin-bottom:14px}
    .fld label{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:6px}
    .fld input{width:100%;padding:13px 14px;border:1px solid var(--line-2);border-radius:13px;background:#fff;font-size:15px;color:var(--ink);outline:none;transition:.15s}
    .fld input:focus,.fld textarea:focus{border-color:var(--gold)}
    .fld textarea{width:100%;padding:13px 14px;border:1px solid var(--line-2);border-radius:13px;background:#fff;font-size:15px;color:var(--ink);outline:none;transition:.15s;font-family:inherit;resize:vertical;min-height:84px}
    [hidden]{display:none!important}
    .row-between{display:flex;justify-content:flex-end;margin:-6px 0 16px}
    .link{background:none;border:0;color:var(--gold-deep);font-size:12.5px;cursor:pointer;text-decoration:none;font-weight:700;padding:0}
    .link:hover{text-decoration:underline}
    .auth-msg{min-height:18px;font-size:13px;margin:4px 0 0;text-align:center}
    .auth-msg.err{color:#c0392b}.auth-msg.ok{color:#2e7d32}
    .auth-foot{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
    .cbtn.block{display:block;width:100%;text-align:center;padding:14px;font-size:15px}
    .topbrand{position:relative;z-index:2;text-align:center;margin:30px 0 22px;font-weight:850;letter-spacing:.04em}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js?v=nucleo-v14"></script>
</head>
<body class="rite" style="display:block;align-items:stretch;justify-content:flex-start">
  <div class="field"><div class="core"></div></div>

  <div class="topbrand"><a href="index.html" style="text-decoration:none;color:inherit">ANIMA</a></div>

  <main class="auth-card">
    <div class="auth-mark"><svg viewBox="23 27 54 48" fill="none"><path d="M28 72 L50 30 L72 72" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>Entra a tu Alma</h1>
    <p class="sub">Tu espacio privado, en la nube.</p>

    <form id="loginForm" autocomplete="on">
      <div class="fld"><label>Correo</label>
        <input id="email" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required /></div>
      <div class="fld"><label>Contraseña</label>
        <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" required /></div>
      <div class="row-between" style="justify-content:space-between;align-items:center">
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);cursor:pointer;font-weight:600">
          <input type="checkbox" id="remember" checked style="width:16px;height:16px;accent-color:var(--gold)"> Recordar sesión</label>
        <a class="link" href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </div>
      <button class="cbtn block" id="loginBtn" type="submit">Entrar ✦</button>
      <div class="auth-msg" id="msg"></div>
    </form>

    <!-- Crear cuenta: solo con una invitación válida (la valida check_invite en la base). -->
    <form id="crearForm" autocomplete="on" hidden>
      <div class="fld"><label>Tu nombre</label>
        <input id="cNombre" type="text" autocomplete="name" required /></div>
      <div class="fld"><label>Correo</label>
        <input id="cEmail" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required /></div>
      <div class="fld"><label>Contraseña</label>
        <input id="cPass" type="password" placeholder="Al menos 8 caracteres" autocomplete="new-password" minlength="8" required /></div>
      <button class="cbtn block" id="crearBtn" type="submit">Despertar mi Alma ✦</button>
      <div class="auth-msg" id="cMsg"></div>
    </form>

    <!-- Pedir acceso: no crea cuenta, deja la petición para que SARK la revise. -->
    <form id="pedirForm" autocomplete="on" hidden>
      <div class="fld"><label>Correo</label>
        <input id="pEmail" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required /></div>
      <div class="fld"><label>Tu nombre</label>
        <input id="pNombre" type="text" autocomplete="name" /></div>
      <div class="fld"><label>¿Qué creas? <span style="text-transform:none;font-weight:600;color:var(--muted)">(opcional)</span></label>
        <textarea id="pMensaje" maxlength="600"></textarea></div>
      <button class="cbtn block" id="pedirBtn" type="submit">Pedir acceso</button>
      <div class="auth-msg" id="pMsg"></div>
    </form>

    <div class="auth-foot" id="pieEntrar">
      ¿Aún no tienes cuenta?<br>
      <a class="link" href="#pedir" id="irPedir">Pedir acceso →</a>
    </div>
    <div class="auth-foot" id="pieVolver" hidden>
      <a class="link" href="entrar.html" id="irEntrar">← Ya tengo cuenta</a>
    </div>
    <p class="seal" style="margin-top:22px">🔒 Tu Raíz, memorias y proyectos son privados.</p>
  </main>

  <script>
  var $=function(id){ return document.getElementById(id); };
  function setMsg(t, ok){ var m=$("msg"); m.textContent=t||""; m.className="auth-msg"+(t?(ok?" ok":" err"):""); }

  /* Reemplaza la tarjeta de ingreso por la explicación. Se le dice lo único que
     de verdad le importa: que no se borró nada suyo, y cuándo vuelve. */
  function mostrarPausa(){
    var card=document.querySelector(".auth-card");
    if(!card) return;
    card.innerHTML =
      '<div class="auth-mark"><svg viewBox="23 27 54 48" fill="none"><path d="M28 72 L50 30 L72 72" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
    + '<h1 style="line-height:1.15">Tu Alma está guardada.<br>El ingreso, en pausa.</h1>'
    + '<p class="sub" style="text-align:left;margin-top:14px">ANIMA está cambiando de piel: lo que empezó como la Alpha se está convirtiendo en la plataforma.</p>'
    + '<p class="sub" style="text-align:left;margin-top:12px"><b>No se borró nada tuyo.</b> Tu trayectoria, tus insignias, tu portafolio y tus huellas en el Árbol siguen exactamente donde las dejaste. Cuando vuelvas a entrar, van a estar ahí.</p>'
    + '<p class="sub" style="text-align:left;margin-top:12px">El acceso se está reabriendo de a poco, por invitación. Si quieres estar entre los primeros, escríbele a SARK.</p>'
    + '<div style="margin-top:24px"><a class="cbtn block" href="index.html" style="text-decoration:none;display:block;text-align:center">Volver a ANIMA</a></div>';
  }

  // Si ya hay sesión, no tiene sentido el login: al Home.
  (async function(){
    try{ if(typeof Cloud!=="undefined" && Cloud.enabled){ var s=await Cloud.session(); if(s) location.replace("home.html"); } }catch(e){}
  })();

  $("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var email=$("email").value.trim(), pass=$("pass").value;
    if(!email || !pass){ setMsg("Ingresa tu correo y contraseña."); return; }
    if(typeof Cloud==="undefined" || !Cloud.enabled){ setMsg("No hay conexión con la nube de ANIMA."); return; }
    var btn=$("loginBtn"); btn.disabled=true; setMsg("Entrando…", true);
    try{ localStorage.setItem("anima_remember", ($("remember")&&$("remember").checked)?"1":"0"); }catch(e){}
    try{
      var r=await Cloud.signIn(email, pass);
      if(r.error) throw r.error;
      try{ sessionStorage.setItem("anima_tab","1"); }catch(e){}
      setMsg("✦ Bienvenida de vuelta.", true);
      location.href="home.html";
    }catch(err){
      btn.disabled=false;
      var m=(err && err.message)||"No se pudo entrar.";
      /* Un Alma de la Alpha en pausa no se equivocó de contraseña: ANIMA cambió.
         Merece que se lo expliquen, no un error en rojo. */
      if(/banned|pausa/i.test(m)){ mostrarPausa(); return; }
      if(/invalid login/i.test(m)) m="Correo o contraseña incorrectos.";
      else if(/email not confirmed/i.test(m)) m="Confirma tu correo antes de entrar (revisa tu bandeja).";
      setMsg(m);
    }
  });

  /* ---------------------------------------------------------------------------
     Tres puertas en una pantalla: entrar, crear cuenta (con invitación) y pedir
     acceso. Antes las dos últimas vivían en /app/, que es COMPANY: STUDIO y
     COMPANY son plataformas separadas y una cuenta de STUDIO nunca pasa por allá.
     --------------------------------------------------------------------------- */
  var titulo = document.querySelector(".auth-card h1"), bajada = document.querySelector(".auth-card .sub");
  function modo(m){
    $("loginForm").hidden = m !== "entrar";
    $("crearForm").hidden = m !== "crear";
    $("pedirForm").hidden = m !== "pedir";
    $("pieEntrar").hidden = m !== "entrar";
    $("pieVolver").hidden = m === "entrar";
    if (m === "crear") { titulo.textContent = "Despierta tu Alma"; bajada.textContent = "Tienes una invitación a ANIMA STUDIO."; }
    else if (m === "pedir") { titulo.textContent = "Pide tu lugar"; bajada.textContent = "El acceso a ANIMA STUDIO es por invitación."; }
    else { titulo.textContent = "Entra a tu Alma"; bajada.textContent = "Tu espacio privado, en la nube."; }
  }

  /* La invitación llega en ?invitacion=CÓDIGO (umbral.html la reenvía aquí). Se
     valida en la base con check_invite: el código no vive en el navegador. */
  var codigo = (function(){
    var q = new URLSearchParams(location.search);
    return (q.get("invitacion") || q.get("codigo") || q.get("code") || "").trim().toUpperCase();
  })();
  (async function(){
    if (location.hash === "#pedir") { modo("pedir"); return; }
    if (!codigo || typeof Cloud === "undefined" || !Cloud.enabled) return;
    try { if (await Cloud.checkInvite(codigo)) modo("crear"); } catch(e) {}
  })();
  $("irPedir").addEventListener("click", function(e){ e.preventDefault(); history.replaceState(null, "", "#pedir"); modo("pedir"); });

  $("crearForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var nombre = $("cNombre").value.trim(), email = $("cEmail").value.trim().toLowerCase(), pass = $("cPass").value;
    var m = $("cMsg");
    function msg(t, ok){ m.textContent = t || ""; m.className = "auth-msg" + (t ? (ok ? " ok" : " err") : ""); }
    if (!nombre || !email || pass.length < 8) { msg("Completa tu nombre, correo y una contraseña de al menos 8 caracteres."); return; }
    var btn = $("crearBtn"); btn.disabled = true; msg("Despertando tu Alma…", true);
    try {
      /* Se vuelve a validar justo antes: entre que abrió la página y ahora, una
         invitación de un solo uso pudo haberse usado. */
      if (!(await Cloud.checkInvite(codigo))) throw new Error("La invitación ya no es válida.");
      var r = await Cloud.signUp(email, pass, nombre);
      if (r.error) throw r.error;
      if (r.data && r.data.session) {
        try { await Cloud.redeemInvite(codigo); } catch(e) {}
        try { await Cloud.completeAwakening(); } catch(e) {}
        try { sessionStorage.setItem("anima_tab", "1"); } catch(e) {}
        location.href = "home.html";
      } else {
        msg("✦ Revisa tu correo: te enviamos un enlace para confirmar la cuenta.", true);
      }
    } catch(err) {
      btn.disabled = false;
      var t = (err && err.message) || "No se pudo crear la cuenta.";
      if (/already registered|already exists/i.test(t)) t = "Ese correo ya tiene cuenta. Entra con tu contraseña.";
      msg(t);
    }
  });

  $("pedirForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var m = $("pMsg");
    function msg(t, ok){ m.textContent = t || ""; m.className = "auth-msg" + (t ? (ok ? " ok" : " err") : ""); }
    var email = $("pEmail").value.trim();
    if (!email) { msg("Escribe tu correo."); return; }
    var btn = $("pedirBtn"); btn.disabled = true; msg("Enviando…", true);
    try {
      await Cloud.pedirAcceso({ email: email, nombre: $("pNombre").value, mensaje: $("pMensaje").value });
      $("pedirForm").reset();
      msg("✦ Listo. Te escribiremos cuando se abra tu lugar.", true);
    } catch(err) {
      btn.disabled = false;
      msg((err && err.message) || "No se pudo enviar. Inténtalo de nuevo.");
    }
  });
  </script>
</body>
</html>
